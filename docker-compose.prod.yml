version: "3.8"

services:
  # Production MySQL Database
  mysql:
    image: mysql:8
    container_name: showtime-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password123}
      MYSQL_DATABASE: ${DB_NAME:-showtime_hub}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    networks:
      - showtime-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Production Backend + Frontend
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: showtime-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MYSQL_URL: mysql://root:${DB_PASSWORD:-password123}@mysql:3306/${DB_NAME:-showtime_hub}
      JWT_SECRET: ${JWT_SECRET}
      TMDB_API_KEY: ${TMDB_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - showtime-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_prod_data:
    driver: local

networks:
  showtime-network:
    driver: bridge
